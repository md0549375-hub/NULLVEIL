# NULLVEIL mod descriptor. Fields below are expanded from gradle.properties at build
# time by the generateModMetadata task (see build.gradle).
license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory

description='''
NULLVEIL is a psychological-horror mod built on uncertainty, imitation, memory, and
trust rather than jump scares, gore, or generic demons.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
